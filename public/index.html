<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b141a">
<title>Verify your number</title>
<style>
:root{--bg:#f0f2f5;--card:#fff;--tx:#111b21;--mut:#667781;--bd:#e0e5e9;--pri:#00a884;--pri-d:#008f72;--err:#d93025;--inp:#f7f8fa}
@media(prefers-color-scheme:dark){:root{--bg:#0b141a;--card:#111b21;--tx:#e9edef;--mut:#8696a0;--bd:#222d34;--pri:#00a884;--pri-d:#06cf9c;--err:#f87171;--inp:#202c33}}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;min-height:100dvh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.wrap{width:100%;max-width:440px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--pri);display:grid;place-items:center;color:#fff}
.pill{display:flex;align-items:center;gap:6px;font-size:12px;padding:5px 11px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}.pill.ok .dot{background:var(--pri)}.pill.bad .dot{background:var(--err)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:26px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.steps{display:flex;gap:6px;margin-bottom:22px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--bd)}.steps i.on{background:var(--pri)}
h1{font-size:22px;margin-bottom:6px}p.sub{color:var(--mut);font-size:14px;line-height:1.55;margin-bottom:20px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:7px}
.field{display:flex;align-items:center;gap:10px;background:var(--inp);border:1.5px solid var(--bd);border-radius:12px;padding:0 14px;transition:.15s}
.field:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px rgba(0,168,132,.15)}
.field svg{flex:none;color:var(--mut)}
input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--tx);font-size:17px;padding:15px 0;font-family:inherit}
input.code{text-align:center;letter-spacing:10px;font-size:24px;font-weight:700}
button{width:100%;margin-top:16px;padding:15px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;font-family:inherit}
button:hover{background:var(--pri-d)}button:disabled{opacity:.55;cursor:not-allowed}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd);margin-top:10px}button.ghost:hover{background:var(--inp)}
#msg{margin-top:14px;min-height:20px;font-size:14px;text-align:center;line-height:1.45}#msg.err{color:var(--err)}#msg.wait{color:var(--mut)}
.hide{display:none}.done{text-align:center;padding:8px 0}
.tick{width:72px;height:72px;border-radius:50%;background:rgba(0,168,132,.12);color:var(--pri);display:grid;place-items:center;margin:0 auto 16px}
.foot{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:16px;font-size:12px;color:var(--mut)}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg></div>Secure Verify</div>
    <div class="pill" id="pill"><span class="dot"></span><span id="pillTx">Checking</span></div>
  </div>
  <div class="card">
    <div class="steps"><i class="on" id="s1"></i><i id="s2"></i></div>
    <div id="stepNum">
      <h1>Verify your number</h1>
      <p class="sub">Enter your WhatsApp number. We will send you a 6-digit verification code.</p>
      <label for="num">WhatsApp number</label>
      <div class="field"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg><input id="num" type="tel" inputmode="tel" autocomplete="tel" placeholder="03XX XXXXXXX"></div>
      <button id="sendBtn">Send code</button>
    </div>
    <div id="stepOtp" class="hide">
      <h1>Enter the code</h1>
      <p class="sub" id="otpSub">We sent a code to your WhatsApp.</p>
      <label for="otp">Verification code</label>
      <div class="field"><input id="otp" class="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="------"></div>
      <button id="verifyBtn">Verify</button>
      <button class="ghost" id="resendBtn" disabled>Resend code</button>
      <button class="ghost" id="backBtn">Change number</button>
    </div>
    <div id="stepDone" class="hide done">
      <div class="tick"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <h1>Verified</h1><p class="sub">Your number has been verified successfully.</p>
    </div>
    <div id="msg"></div>
  </div>
  <div class="foot"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Codes are one-time and expire automatically</div>
</div>
<script>
const $=id=>document.getElementById(id);let number='',timer=null;
async function api(url,body){try{const r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:undefined);return await r.json()}catch{return{ok:false,error:'Network error. Please try again.'}}}
function msg(t,c){const m=$('msg');m.textContent=t||'';m.className=c||''}
function busy(b,on,txt){b.disabled=on;if(on){b.dataset.t=b.textContent;b.innerHTML='<span class="spin"></span>'+txt}else b.textContent=b.dataset.t||b.textContent}
function show(step){['stepNum','stepOtp','stepDone'].forEach(i=>$(i).classList.toggle('hide',i!==step));$('s2').classList.toggle('on',step!=='stepNum')}
function cooldown(s){clearInterval(timer);const b=$('resendBtn');b.disabled=true;let n=s;const t=()=>{b.textContent=n>0?'Resend in '+n+'s':'Resend code';if(n--<=0){clearInterval(timer);b.disabled=false}};t();timer=setInterval(t,1000)}
async function status(){const s=await api('/api/status');const p=$('pill');if(s&&s.ready){p.className='pill ok';$('pillTx').textContent='Online'}else{p.className='pill bad';$('pillTx').textContent='Offline'}}
async function send(resend){const v=$('num').value.trim();if(!v&&!resend)return msg('Please enter your number.','err');msg('');const b=resend?$('resendBtn'):$('sendBtn');busy(b,true,'Sending');
  const r=await api('/api/send-otp',{number:resend?number:v});busy(b,false);
  if(!r.ok){if(resend)b.disabled=false;return msg(r.error||'Could not send code.','err')}
  number=r.number;$('otpSub').textContent='We sent a code to +'+number+' on WhatsApp.';show('stepOtp');$('otp').value='';$('otp').focus();cooldown(60);msg('Code sent. Check WhatsApp.','wait')}
$('sendBtn').onclick=()=>send(false);$('resendBtn').onclick=()=>send(true);
$('backBtn').onclick=()=>{show('stepNum');msg('')};
$('verifyBtn').onclick=async()=>{const o=$('otp').value.trim();if(o.length<6)return msg('Enter the 6-digit code.','err');msg('');busy($('verifyBtn'),true,'Verifying');
  const r=await api('/api/verify-otp',{number,otp:o});busy($('verifyBtn'),false);
  if(!r.ok)return msg(r.error||'Invalid code.','err');show('stepDone');msg('')};
$('num').addEventListener('keydown',e=>e.key==='Enter'&&send(false));
$('otp').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'');if(e.target.value.length===6)$('verifyBtn').click()});
status();setInterval(status,30000);
</script>
</body>
</html>
